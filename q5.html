<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 5 - Even or Odd Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Question 5: Even or Odd Checker</h1>
      <p>Determine whether a given number is even or odd using conditional statements.</p>
    </header>

    <div class="card">
      <h2 class="card-title">Number Input</h2>
      <div class="form-group">
        <label for="num">Enter an Integer:</label>
        <input type="number" id="num" class="form-control" value="17" placeholder="e.g. 24" oninput="checkEvenOdd()">
      </div>

      <div class="result-box">
        <h3>Result</h3>
        <div id="even-odd-res" class="result-value">17 is an ODD number.</div>
      </div>
    </div>
  </div>

  <script>
    function checkEvenOdd() {
      const val = document.getElementById('num').value;
      const resContainer = document.getElementById('even-odd-res');

      if (val === "") {
        resContainer.innerHTML = "Please enter a number.";
        return;
      }

      const num = parseInt(val, 10);
      if (isNaN(num)) {
        resContainer.innerHTML = "Invalid integer.";
        return;
      }

      // Conditional statement (if-else)
      if (num % 2 === 0) {
        resContainer.innerHTML = `<span class="badge badge-success">EVEN</span> ${num} is an EVEN number.`;
      } else {
        resContainer.innerHTML = `<span class="badge badge-warning">ODD</span> ${num} is an ODD number.`;
      }
    }

    checkEvenOdd();
  </script>
</body>
</html>
