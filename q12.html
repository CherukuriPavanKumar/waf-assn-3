<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 12 - Reverse Digits of a Number</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Question 12: Reverse Digits of a Number</h1>
      <p>Reverse the digits of a given integer using a loop.</p>
    </header>

    <div class="card">
      <h2 class="card-title">Number Input</h2>
      <div class="form-group">
        <label for="rev-input">Enter Integer:</label>
        <input type="number" id="rev-input" class="form-control" value="12345" oninput="reverseNumber()">
      </div>

      <div class="result-box">
        <h3>Reversed Result</h3>
        <p><strong>Original Number:</strong> <span id="orig-val">12345</span></p>
        <p style="margin-top: 0.5rem;"><strong>Reversed Digits:</strong> <span id="rev-res" class="result-value">54321</span></p>
      </div>
    </div>
  </div>

  <script>
    function reverseNumber() {
      const val = document.getElementById('rev-input').value;
      const origVal = document.getElementById('orig-val');
      const revRes = document.getElementById('rev-res');

      if (val === "") {
        origVal.innerText = "-";
        revRes.innerText = "-";
        return;
      }

      let num = parseInt(val, 10);
      if (isNaN(num)) {
        origVal.innerText = "Invalid";
        revRes.innerText = "Invalid";
        return;
      }

      origVal.innerText = num;

      const isNegative = num < 0;
      let temp = Math.abs(num);
      let reversed = 0;

      // Loop to extract last digit and build reversed number
      while (temp > 0) {
        let lastDigit = temp % 10;
        reversed = (reversed * 10) + lastDigit;
        temp = Math.floor(temp / 10);
      }

      if (isNegative) {
        reversed = -reversed;
      }

      revRes.innerText = reversed;
    }

    reverseNumber();
  </script>
</body>
</html>
