<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 13 - Switch Statement Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Question 13: Switch Statement Calculator</h1>
      <p>Implement a simple calculator using JavaScript switch statement for arithmetic operations.</p>
    </header>

    <div class="card">
      <h2 class="card-title">Calculator Inputs</h2>
      <div class="grid-2">
        <div class="form-group">
          <label for="op1">First Operand:</label>
          <input type="number" id="op1" class="form-control" value="24" oninput="runSwitchCalc()">
        </div>
        <div class="form-group">
          <label for="op2">Second Operand:</label>
          <input type="number" id="op2" class="form-control" value="4" oninput="runSwitchCalc()">
        </div>
      </div>

      <div class="form-group">
        <label for="operator">Select Arithmetic Operator:</label>
        <select id="operator" class="form-control" onchange="runSwitchCalc()">
          <option value="+">Addition (+)</option>
          <option value="-">Subtraction (-)</option>
          <option value="*">Multiplication (&times;)</option>
          <option value="/">Division (&divide;)</option>
          <option value="%">Modulus (%)</option>
        </select>
      </div>

      <div class="result-box">
        <h3>Result</h3>
        <div id="switch-res" class="result-value">24 + 4 = 28</div>
      </div>
    </div>
  </div>

  <script>
    function runSwitchCalc() {
      const a = parseFloat(document.getElementById('op1').value);
      const b = parseFloat(document.getElementById('op2').value);
      const op = document.getElementById('operator').value;
      const resContainer = document.getElementById('switch-res');

      if (isNaN(a) || isNaN(b)) {
        resContainer.innerText = "Please enter valid numbers.";
        return;
      }

      let result;
      let error = null;

      // Implementation using switch statement
      switch (op) {
        case '+':
          result = a + b;
          break;
        case '-':
          result = a - b;
          break;
        case '*':
          result = a * b;
          break;
        case '/':
          if (b === 0) {
            error = "Cannot divide by zero!";
          } else {
            result = a / b;
          }
          break;
        case '%':
          if (b === 0) {
            error = "Cannot calculate modulus with zero divisor!";
          } else {
            result = a % b;
          }
          break;
        default:
          error = "Invalid Operator";
      }

      if (error) {
        resContainer.innerHTML = `<span class="badge badge-warning">ERROR</span> ${error}`;
      } else {
        resContainer.innerHTML = `<strong>${a} ${op} ${b} = ${result}</strong>`;
      }
    }

    runSwitchCalc();
  </script>
</body>
</html>
