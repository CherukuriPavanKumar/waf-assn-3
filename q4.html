<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 4 - Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Question 4: Temperature Converter</h1>
      <p>Convert Celsius to Fahrenheit and vice versa using JavaScript functions.</p>
    </header>

    <div class="grid-2">
      <!-- Celsius to Fahrenheit Card -->
      <div class="card">
        <h2 class="card-title">Celsius to Fahrenheit</h2>
        <div class="form-group">
          <label for="celsius">Celsius (&deg;C):</label>
          <input type="number" id="celsius" class="form-control" value="25" oninput="convertCtoF()">
        </div>
        <div class="result-box">
          <h3>Fahrenheit (&deg;F)</h3>
          <div id="c-to-f-res" class="result-value">77 &deg;F</div>
        </div>
      </div>

      <!-- Fahrenheit to Celsius Card -->
      <div class="card">
        <h2 class="card-title">Fahrenheit to Celsius</h2>
        <div class="form-group">
          <label for="fahrenheit">Fahrenheit (&deg;F):</label>
          <input type="number" id="fahrenheit" class="form-control" value="98.6" oninput="convertFtoC()">
        </div>
        <div class="result-box">
          <h3>Celsius (&deg;C)</h3>
          <div id="f-to-c-res" class="result-value">37 &deg;C</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Function to convert Celsius to Fahrenheit
    function celsiusToFahrenheit(c) {
      return (c * 9 / 5) + 32;
    }

    // Function to convert Fahrenheit to Celsius
    function fahrenheitToCelsius(f) {
      return (f - 32) * 5 / 9;
    }

    function convertCtoF() {
      const c = parseFloat(document.getElementById('celsius').value);
      if (isNaN(c)) {
        document.getElementById('c-to-f-res').innerHTML = "-";
        return;
      }
      const f = celsiusToFahrenheit(c);
      document.getElementById('c-to-f-res').innerHTML = `${f.toFixed(2)} &deg;F`;
    }

    function convertFtoC() {
      const f = parseFloat(document.getElementById('fahrenheit').value);
      if (isNaN(f)) {
        document.getElementById('f-to-c-res').innerHTML = "-";
        return;
      }
      const c = fahrenheitToCelsius(f);
      document.getElementById('f-to-c-res').innerHTML = `${c.toFixed(2)} &deg;C`;
    }

    // Initialize
    convertCtoF();
    convertFtoC();
  </script>
</body>
</html>
