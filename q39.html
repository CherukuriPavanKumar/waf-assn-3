<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 39 - Interactive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-container {
      max-width: 600px;
      margin: 1.5rem auto;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }
    .gallery-viewport {
      width: 100%;
      height: 320px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
    }
    .gallery-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .gallery-item.active {
      opacity: 1;
      visibility: visible;
    }
    .gallery-item svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-caption {
      padding: 1.25rem;
      background: rgba(30, 41, 59, 0.8);
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .gallery-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }
    .gallery-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .gallery-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: #0f172a;
      border-top: 1px solid var(--border);
    }
    .gallery-btn {
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
    }
    .gallery-dots {
      display: flex;
      gap: 0.5rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Question 39: Vector Image Gallery</h1>
      <p>A simple image gallery with Next and Previous buttons. Event handling transitions the displayed images, captions, and pagination indicators.</p>
    </header>

    <div class="gallery-container">
      <!-- Image Viewport containing 4 inline SVGs -->
      <div class="gallery-viewport">
        
        <!-- Slide 1 -->
        <div class="gallery-item active" id="slide-0">
          <svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1e1b4b" />
                <stop offset="100%" stop-color="#4f46e5" />
              </linearGradient>
            </defs>
            <rect width="600" height="320" fill="url(#g1)" />
            <circle cx="300" cy="160" r="70" fill="#facc15" filter="drop-shadow(0 0 25px rgba(250,204,21,0.6))" />
            <path d="M 0 260 Q 150 200 300 250 T 600 240 L 600 320 L 0 320 Z" fill="#0f172a" opacity="0.8"/>
            <path d="M 0 280 Q 200 240 400 290 T 600 270 L 600 320 L 0 320 Z" fill="#020617"/>
            <text x="50%" y="22%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="20" opacity="0.3">SPACE VOYAGE</text>
          </svg>
        </div>

        <!-- Slide 2 -->
        <div class="gallery-item" id="slide-1">
          <svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="100%" stop-color="#3b0764" />
              </linearGradient>
            </defs>
            <rect width="600" height="320" fill="url(#g2)" />
            <!-- City buildings -->
            <rect x="50" y="140" width="60" height="180" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
            <rect x="140" y="80" width="80" height="240" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1" />
            <rect x="250" y="160" width="90" height="160" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
            <rect x="380" y="110" width="70" height="210" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" />
            <rect x="480" y="180" width="70" height="140" fill="#020617" stroke="#ec4899" stroke-width="1" />
            <text x="50%" y="22%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="20" opacity="0.3">NEON METROPOLIS</text>
          </svg>
        </div>

        <!-- Slide 3 -->
        <div class="gallery-item" id="slide-2">
          <svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#06b6d4" />
                <stop offset="100%" stop-color="#0f766e" />
              </linearGradient>
            </defs>
            <rect width="600" height="320" fill="url(#g3)" />
            <!-- Mountains -->
            <polygon points="150,100 0,320 300,320" fill="#115e59" />
            <polygon points="400,80 200,320 600,320" fill="#134e4a" />
            <polygon points="300,140 150,320 450,320" fill="#14b8a6" opacity="0.5"/>
            <text x="50%" y="22%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="20" opacity="0.3">MOUNTAIN PEAKS</text>
          </svg>
        </div>

        <!-- Slide 4 -->
        <div class="gallery-item" id="slide-3">
          <svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0c4a6e" />
                <stop offset="100%" stop-color="#082f49" />
              </linearGradient>
            </defs>
            <rect width="600" height="320" fill="url(#g4)" />
            <!-- Bubbles/Waves -->
            <circle cx="100" cy="200" r="15" fill="rgba(255,255,255,0.1)" />
            <circle cx="120" cy="120" r="8" fill="rgba(255,255,255,0.1)" />
            <circle cx="480" cy="150" r="25" fill="rgba(255,255,255,0.08)" />
            <circle cx="510" cy="90" r="12" fill="rgba(255,255,255,0.08)" />
            <path d="M 0 100 Q 150 150 300 100 T 600 100 L 600 320 L 0 320 Z" fill="#0f172a" opacity="0.2"/>
            <text x="50%" y="22%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="20" opacity="0.3">DEEP OCEAN</text>
          </svg>
        </div>

      </div>

      <!-- Caption Box -->
      <div class="gallery-caption">
        <div id="galleryTitle" class="gallery-title">Space Voyage</div>
        <div id="galleryDesc" class="gallery-desc">Cosmic exploration traversing through colorful solar flares.</div>
      </div>

      <!-- Navigation Bar -->
      <div class="gallery-controls">
        <button class="btn btn-secondary gallery-btn" onclick="navigateGallery(-1)">&larr; Prev</button>
        
        <!-- Index indicators -->
        <div class="gallery-dots" id="dotsContainer">
          <span class="dot active" onclick="setSlide(0)"></span>
          <span class="dot" onclick="setSlide(1)"></span>
          <span class="dot" onclick="setSlide(2)"></span>
          <span class="dot" onclick="setSlide(3)"></span>
        </div>

        <button class="btn gallery-btn" onclick="navigateGallery(1)">Next &rarr;</button>
      </div>
    </div>
  </div>

  <script>
    // Gallery Data
    const slidesData = [
      {
        title: "Space Voyage",
        desc: "Cosmic exploration traversing through colorful solar flares."
      },
      {
        title: "Neon Metropolis",
        desc: "High-density skyscrapers shimmering under magenta cyberpunk neon light lines."
      },
      {
        title: "Mountain Peaks",
        desc: "Snowy range summits standing tall against a bright teal gradient horizon."
      },
      {
        title: "Deep Ocean",
        desc: "Vast underwater depths sheltering aquatic ecosystems in deep blue shadows."
      }
    ];

    let currentSlide = 0;
    const totalSlides = slidesData.length;

    function renderSlide() {
      // 1. Update slide visibility
      for (let i = 0; i < totalSlides; i++) {
        const slide = document.getElementById(`slide-${i}`);
        const dots = document.getElementById('dotsContainer').children;
        
        if (i === currentSlide) {
          slide.classList.add('active');
          dots[i].classList.add('active');
        } else {
          slide.classList.remove('active');
          dots[i].classList.remove('active');
        }
      }

      // 2. Update caption titles & text
      document.getElementById('galleryTitle').innerText = slidesData[currentSlide].title;
      document.getElementById('galleryDesc').innerText = slidesData[currentSlide].desc;
    }

    function navigateGallery(direction) {
      currentSlide += direction;
      
      // Infinite loop wraps
      if (currentSlide < 0) {
        currentSlide = totalSlides - 1;
      } else if (currentSlide >= totalSlides) {
        currentSlide = 0;
      }
      
      renderSlide();
    }

    function setSlide(index) {
      currentSlide = index;
      renderSlide();
    }
  </script>
</body>
</html>
