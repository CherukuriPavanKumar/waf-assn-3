<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 6 - Largest of Three Numbers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Question 6: Largest of Three Numbers</h1>
      <p>Find the largest among three numbers using if-else statements.</p>
    </header>

    <div class="card">
      <h2 class="card-title">Enter Three Numbers</h2>
      <div class="grid-2" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="form-group">
          <label for="num1">First Number (A):</label>
          <input type="number" id="num1" class="form-control" value="45" oninput="findLargest()">
        </div>
        <div class="form-group">
          <label for="num2">Second Number (B):</label>
          <input type="number" id="num2" class="form-control" value="89" oninput="findLargest()">
        </div>
        <div class="form-group">
          <label for="num3">Third Number (C):</label>
          <input type="number" id="num3" class="form-control" value="32" oninput="findLargest()">
        </div>
      </div>

      <div class="result-box">
        <h3>Largest Number</h3>
        <div id="largest-res" class="result-value">-</div>
      </div>
    </div>
  </div>

  <script>
    function findLargest() {
      const a = parseFloat(document.getElementById('num1').value);
      const b = parseFloat(document.getElementById('num2').value);
      const c = parseFloat(document.getElementById('num3').value);
      const resContainer = document.getElementById('largest-res');

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        resContainer.innerText = "Please enter valid numbers for all inputs.";
        return;
      }

      let largest;
      let label;

      // using if-else statements
      if (a >= b && a >= c) {
        largest = a;
        label = "First Number (A)";
      } else if (b >= a && b >= c) {
        largest = b;
        label = "Second Number (B)";
      } else {
        largest = c;
        label = "Third Number (C)";
      }

      resContainer.innerHTML = `<span class="badge">${label}</span> <strong>${largest}</strong> is the largest number.`;
    }

    findLargest();
  </script>
</body>
</html>
